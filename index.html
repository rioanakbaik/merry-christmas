<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Merry Christmas - I Miss You</title>

    <style>

        /* =========================
           FONT & RESET
        ========================= */

        @font-face {
            font-family: "VerandahReverie";
            src: url("VerandahReverie_PERSONAL_USE_ONLY.otf")
                format("opentype");

            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {
            width: 100%;
            height: 100vh;

            overflow: hidden;

            background: #000;
            color: #fff;

            font-family:
                "VerandahReverie",
                Georgia,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }


        /* =========================
           HEARTS
        ========================= */

        #hearts {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .heart {
            position: absolute;

            top: -30px;

            color: #ff1744;

            opacity: 0.6;

            filter:
                drop-shadow(
                    0 0 6px
                    rgba(255, 23, 68, 0.6)
                );

            animation:
                fall linear forwards;

            user-select: none;
        }


        @keyframes fall {

            0% {
                transform:
                    translateY(-30px)
                    translateX(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateY(50vh)
                    translateX(25px)
                    rotate(180deg);
            }

            100% {
                transform:
                    translateY(110vh)
                    translateX(-20px)
                    rotate(360deg);
            }

        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: min(90%, 430px);

            display: flex;

            flex-direction: column;

            align-items: center;

            position: relative;

            z-index: 5;
        }


        /* =========================
           LYRICS
        ========================= */

        .lyrics-container {
            width: 100%;

            min-height: 190px;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            position: relative;
        }


        .lyric-line {
            position: absolute;

            max-width: 90%;

            font-size: 38px;

            line-height: 1.25;

            color: #fff;

            text-shadow:
                0 0 14px
                rgba(255, 255, 255, 0.25);

            opacity: 0;

            transform:
                translateY(18px)
                scale(0.95);

            transition:
                opacity 0.5s
                cubic-bezier(0.25, 1, 0.5, 1),

                transform 0.5s
                cubic-bezier(0.25, 1, 0.5, 1);

            pointer-events: none;
        }


        .lyric-line.active {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }


        /* =========================
           DEDICATION
        ========================= */

        .dedication {
            margin-top: 14px;

            font-size: 14px;

            letter-spacing: 2px;

            color:
                rgba(255, 255, 255, 0.6);

            text-align: center;

            text-transform: uppercase;
        }


        /* =========================
           WAVE
        ========================= */

        .love-wave-wrapper {
            width: 100%;

            margin-top: 32px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        .love-wave {
            width: 100%;

            height: 65px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 4px;
        }


        .wave-line {
            width: 2px;

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.45);

            transform-origin: center;
        }


        /* =========================
           WAVE HEIGHTS
        ========================= */

        .wave-line:nth-child(1),
        .wave-line:nth-child(20) {
            height: 10px;
        }

        .wave-line:nth-child(2),
        .wave-line:nth-child(19) {
            height: 16px;
        }

        .wave-line:nth-child(3),
        .wave-line:nth-child(18) {
            height: 24px;
        }

        .wave-line:nth-child(4),
        .wave-line:nth-child(17) {
            height: 34px;
        }

        .wave-line:nth-child(5),
        .wave-line:nth-child(16) {
            height: 44px;
        }

        .wave-line:nth-child(6),
        .wave-line:nth-child(15) {
            height: 54px;
        }

        .wave-line:nth-child(7),
        .wave-line:nth-child(14) {
            height: 42px;
        }

        .wave-line:nth-child(8),
        .wave-line:nth-child(13) {
            height: 30px;
        }

        .wave-line:nth-child(9),
        .wave-line:nth-child(12) {
            height: 20px;
        }

        .wave-line:nth-child(10),
        .wave-line:nth-child(11) {
            height: 14px;
        }


        /* =========================
           WAVE ANIMATION
        ========================= */

        .love-wave.playing .wave-line {

            background:
                rgba(255, 255, 255, 0.85);

            animation:
                waveMove
                0.8s
                ease-in-out
                infinite
                alternate;
        }


        .love-wave.playing
        .wave-line:nth-child(2n) {

            animation-delay: 0.1s;
        }


        .love-wave.playing
        .wave-line:nth-child(3n) {

            animation-delay: 0.2s;
        }


        .love-wave.playing
        .wave-line:nth-child(4n) {

            animation-delay: 0.3s;
        }


        @keyframes waveMove {

            0% {
                transform: scaleY(0.4);

                opacity: 0.4;
            }

            100% {
                transform: scaleY(1.3);

                opacity: 1;
            }

        }


        /* =========================
           PLAY BUTTON
        ========================= */

        #play-btn {

            margin-top: 14px;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 255, 255, 0.4);

            background:
                rgba(255, 255, 255, 0.08);

            color: white;

            font-size: 16px;

            cursor: pointer;

            display: flex;

            justify-content: center;

            align-items: center;

            transition:
                all 0.35s ease;
        }


        #play-btn:hover {

            transform: scale(1.08);

            background:
                rgba(255, 23, 68, 0.2);

            border-color:
                #ff1744;

            box-shadow:
                0 0 18px
                rgba(255, 23, 68, 0.35);
        }


        /* BUTTON HIDDEN */

        #play-btn.hidden {

            opacity: 0;

            pointer-events: none;

            transform:
                scale(0.7);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .lyric-line {
                font-size: 30px;
            }

            .lyrics-container {
                min-height: 160px;
            }

            .love-wave {
                height: 50px;

                gap: 3px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         BACKGROUND HEARTS
    ========================= -->

    <div id="hearts"></div>


    <!-- =========================
         MAIN
    ========================= -->

    <div class="container">


        <!-- =========================
             LYRICS
        ========================= -->

        <div class="lyrics-container">


            <div class="lyric-line">
                You know it's true
            </div>


            <div class="lyric-line">
                Yeah, I miss you
            </div>


            <div class="lyric-line">
                You know it's true
            </div>


            <div class="lyric-line">
                So what if I call
            </div>


            <div class="lyric-line">
                And you pick up the phone
            </div>


            <div class="lyric-line">
                And I use this holiday to make my way to your ghost
            </div>


            <div class="lyric-line">
                Oh, what if you're lonely
            </div>


            <div class="lyric-line">
                And you know I am too
            </div>


            <div class="lyric-line">
                And I get the chance to say
            </div>


            <div class="lyric-line">
                Merry Christmas, I miss you
            </div>


            <div class="lyric-line">
                I miss you
            </div>


        </div>


        <!-- =========================
             DEDICATION
        ========================= -->

        <div class="dedication">
            I really miss you Mora :)
        </div>


        <!-- =========================
             WAVE + BUTTON
        ========================= -->

        <div class="love-wave-wrapper">


            <div
                class="love-wave"
                id="love-wave">


                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>

                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>

                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>

                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>
                <span class="wave-line"></span>


            </div>


            <button
                id="play-btn"
                type="button"
                aria-label="Play Music">

                ▶

            </button>


        </div>


    </div>


    <!-- =========================
         AUDIO
    ========================= -->

    <audio
        id="audio"
        src="music.mp3"
        preload="auto">
    </audio>


    <script>


        /* =========================
           ELEMENTS
        ========================= */

        const heartsContainer =
            document.getElementById("hearts");


        const playBtn =
            document.getElementById("play-btn");


        const loveWave =
            document.getElementById("love-wave");


        const audio =
            document.getElementById("audio");


        const lines =
            document.querySelectorAll(".lyric-line");


        /* =========================
           LYRIC TIMINGS
        ========================= */

        const lyricTimings = [

            0,

            5,

            10,

            14,

            18,

            28,

            29,

            35,

            40,

            45,

            50

        ];


        /* =========================
           STATE
        ========================= */

        let currentLyricIndex = -1;

        let started = false;


        /* =========================
           CREATE HEART
        ========================= */

        function createHeart() {


            const heart =
                document.createElement("div");


            heart.className =
                "heart";


            heart.textContent =
                "♥";


            heart.style.left =
                Math.random() * 100 + "vw";


            heart.style.fontSize =
                (Math.random() * 8 + 8)
                + "px";


            heart.style.opacity =
                (Math.random() * 0.5 + 0.3)
                .toFixed(2);


            const duration =
                Math.random() * 4 + 5;


            heart.style.animationDuration =
                duration + "s";


            heartsContainer.appendChild(
                heart
            );


            setTimeout(() => {

                heart.remove();

            }, duration * 1000);

        }


        setInterval(
            createHeart,
            180
        );


        /* =========================
           UPDATE LYRICS
        ========================= */

        function updateLyrics() {


            const time =
                audio.currentTime;


            let activeIndex = -1;


            for (
                let i = 0;
                i < lyricTimings.length;
                i++
            ) {


                if (
                    time >=
                    lyricTimings[i]
                ) {

                    activeIndex = i;

                } else {

                    break;

                }

            }


            if (
                activeIndex ===
                currentLyricIndex
            ) {

                return;

            }


            currentLyricIndex =
                activeIndex;


            lines.forEach(
                (line, index) => {


                    line.classList.toggle(
                        "active",
                        index === activeIndex
                    );


                }
            );

        }


        /* =========================
           PLAY MUSIC
        ========================= */

        playBtn.addEventListener(
            "click",
            async () => {


                if (started) {

                    return;

                }


                try {


                    audio.currentTime = 0;


                    await audio.play();


                    started = true;


                    playBtn.classList.add(
                        "hidden"
                    );


                    loveWave.classList.add(
                        "playing"
                    );


                    updateLyrics();


                }


                catch (error) {


                    console.error(
                        "Gagal memutar audio:",
                        error
                    );


                    alert(
                        "Audio gagal diputar. Pastikan music.mp3 berada di folder yang sama dengan index.html."
                    );


                }

            }
        );


        /* =========================
           AUDIO TIME UPDATE
        ========================= */

        audio.addEventListener(
            "timeupdate",
            updateLyrics
        );


        /* =========================
           AUDIO PLAY
        ========================= */

        audio.addEventListener(
            "play",
            () => {

                loveWave.classList.add(
                    "playing"
                );

            }
        );


        /* =========================
           AUDIO PAUSE
        ========================= */

        audio.addEventListener(
            "pause",
            () => {

                loveWave.classList.remove(
                    "playing"
                );

            }
        );


        /* =========================
           AUDIO ENDED
        ========================= */

        audio.addEventListener(
            "ended",
            () => {


                loveWave.classList.remove(
                    "playing"
                );


                currentLyricIndex = -1;


                lines.forEach(
                    line => {

                        line.classList.remove(
                            "active"
                        );

                    }
                );


            }
        );


    </script>

</body>

</html>
